schema_version: "2026.04"
status: research                           # draft | research | ready | in_progress | blocked | done | cancelled | superseded
created: 2026-08-04
updated: 2026-08-04

# Origin (optional — informational, not a dependency)
# source: "https://..."                 # Shareable origin breadcrumb, never a local filesystem path like /home/... or /Users/...
# tracking_id: ""                       # External reference (Notion task, Jira ticket, etc.)

# Dependencies (optional — advisory ordering, not execution blockers)
# depends_on:
#   - "SPEC-030"                        # Lightweight sequencing; upstream should usually be done first
# blocked_by:
#   - spec: "SPEC-030"
#     until_status: "ready"            # required; ready | done

coordination:
  blast_radius: isolated
  parallel_safe: true

# Branching (optional — non-default branch topology for stacked or integration workflows)
# branching:
#   base_branch: ""                    # Branch to fork from; defaults to repo default branch when absent
#   target_branch: ""                  # PR base branch; defaults to repo default branch when absent

# Freshness snapshot (populate when status reaches ready)
# ready_sha: ""                         # Full git HEAD commit recorded at the ready transition; used for advisory staleness checks

# Completion (populate when status reaches done)
# completion:
#   date: 2026-08-04
#   acceptance_criteria_waived:         # Omit if none waived
#     - acceptance_criteria: ""
#       rationale: ""
#   self_review_waived:                 # Omit if none waived; pr-review blocking findings the user accepted to proceed
#     - finding: ""
#       rationale: ""
#   pull_requests:
#     - "https://github.com/..."

learnings:
  - type: assumption_invalidated
    summary: >-
      No authoritative fixed list of DirectRoute-supported Symbol (shape)
      or Color values exists in any checked source (repo golden template,
      public Trimble docs, ledger, prior specs) — the spec's premise that
      such a vendor-fixed list can be sourced from documentation does not
      hold, and the spec's own scope boundary forbids inventing one.
    context: >-
      fixtures/stop/TEMPLATE_NewConfigStopFile.xls "Header Desc." sheet
      describes Symbol/Color as "recommended but not required" with no
      enum; Trimble's public file-import and ImportOrders docs show only
      3 example values (Circle, Red, green) with inconsistent casing and
      no published enum. Blocks the research->ready gate until an
      internal source (Notion field reference or an empirical DirectRoute
      export) is obtained, or the ACs are revised to not require a
      vendor-fixed enum.
    tags: ["directroute-file-formats", "blocker", "research-gate"]
    date: 2026-08-05
