learnings:
  - type: pattern_discovered
    summary: "For subset flags on stop rows (Delete, EQ codes), compute k with min(N, max(1, round(fraction*N))) then sample on a dedicated random.Random(config.seed) after build_rows finishes - not the build_rows RNG stream."
    context: >
      SPEC-016 Action Delete selection in backend/generators/stop.py
      (delete_action_count + generate_stop_csv_file). Keeps Delete indices
      stable if build_rows RNG consumption changes; same math as eq_code
      subset selection with fraction 0.1. Assert exact indices via an
      independent Random(seed).sample in tests.
    tags: [rng, stop-generator, testing]
    date: 2026-08-05
  - type: gotcha
    summary: "Emit Excel-friendly CSV with csv.writer(StringIO(newline=''), dialect=csv.excel) then encode utf-8-sig for BOM; never hand-build CSV strings."
    context: >
      SPEC-016 generate_stop_csv_file. csv.excel gives comma, QUOTE_MINIMAL,
      and CRLF; newline='' on StringIO preserves those line endings.
    tags: [csv, excel, stop-generator]
    date: 2026-08-05
  - type: pattern_discovered
    summary: "On-demand download artifacts that need extra download-time fields (e.g. Branch) must keep StopConfig on the download step and collect those fields only then - do not put them in wizard form persistence."
    context: >
      SPEC-016 plumbed stopConfig into components/wizard/download.tsx and
      used local Branch state with FormRow; hooks/use-wizard-persistence.ts
      and lib/build-config.ts stayed untouched. Pair with
      /api/stops-csv/{generate,download} accepting StopCsvRequest
      (StopConfig + branch).
    tags: [frontend, api-contracts, wizard]
    date: 2026-08-05
