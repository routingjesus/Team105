# Learnings (add during and after execution)
learnings:
  - type: pattern_discovered
    summary: "Embeddable CPython ._pth ignores CWD and PYTHONPATH; package must add a relative ..\\..\\app entry so uvicorn can import backend.main"
    context: "Without that ._pth line, launch-portable fails at the backend.main probe even though backend/ sits in the launcher CWD. Regular CPython (run-local .venv) does not need this."
    tags: [portable, python, embeddable, windows]
    date: 2026-08-06
  - type: pitfall
    summary: "PowerShell functions must not return paths after bare npm/robocopy stdout; pipe npm to Out-Host and avoid unquoted robocopy args on paths with spaces/!"
    context: "Build-NextStandalone initially returned npm build logs as the standalone path; Start-Process robocopy split C:\\...\\! Cursor\\... on spaces. Use Copy-Item tree copy instead."
    tags: [powershell, packaging, windows]
    date: 2026-08-06
