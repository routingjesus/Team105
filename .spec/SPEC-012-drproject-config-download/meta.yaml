  - type: constraint_found
    summary: "DRProject.config has no public schema — need an owner-supplied sample before this spec can leave research"
    context: >
      DRProject.config is proprietary/undocumented outside DirectRoute itself
      (no public Trimble/Appian reference found), structurally the same gap
      SPEC-001 hit for the .TRUCK macro schema and SPEC-002 hit for the stop
      column catalog — both were resolved by the owner supplying a real
      sample file bundled as a golden fixture (fixtures/truck/,
      fixtures/stop/). The user's own message referenced a real local
      DRProject.config from an existing project as the intended template
      source. Once supplied (sanitized of proprietary customer data),
      bundle it under fixtures/drproject-config/ and finalize spec.md's
      AC 2/AC 3 field list and the structural-parity test expectations
      against it before transitioning this spec to ready.
