# Learnings (add during and after execution)
learnings:
  - type: assumption_confirmed
    summary: "DRProject.config is UTF-8 XML with root AppSettings; wizard-driven content lives under Configuration/Stop"
    context: >
      Owner-supplied golden template (bundled at fixtures/drproject-config/)
      confirms the file structure: AppSettings > Configuration (Stop field
      aliases + Quantities) + Preferences (passthrough with sanitized paths).
      Depot addresses are NOT in this file — it maps stop-file column display
      names, not routing geography. Substitution targets align with
      AliasConfig and VolumeSpec from the existing stop/truck schemas.
    tags: [directroute, drproject-config, file-format]
    date: 2026-08-05
    source_spec: SPEC-012
  - type: constraint_found
    summary: "Machine-specific paths and DRTrack credentials must be cleared in generated DRProject.config output"
    context: >
      The owner template contained local filesystem paths (RecentFilesList,
      DistanceFile, etc.) and encrypted DRTrack credentials. These are
      environment-specific and must always be emitted empty in generated
      output, regardless of wizard input.
    tags: [directroute, drproject-config, data-hygiene]
    date: 2026-08-05
    source_spec: SPEC-012
