learnings:
  - type: constraint_found
    summary: "vitest toEqual fails on byte-identical Uint8Arrays from fflate unzipSync"
    context: >
      unzipSync returns subarray views over a shared buffer, and vitest's
      typed-array deep-equality is sensitive to the underlying buffer view,
      producing "Compared values have no visual difference" failures on
      byte-identical content. Compare Array.from(bytes) on both sides instead.
    tags: [vitest, fflate, typed-arrays, testing]
    date: 2026-08-06
  - type: constraint_found
    summary: "TS 5.9 generic Uint8Array<ArrayBufferLike> is not assignable to BlobPart"
    context: >
      fflate 0.8.3 type declarations predate TypeScript's generic typed
      arrays, so zipSync returns Uint8Array<ArrayBufferLike>, which new Blob()
      rejects. Annotate decode helpers as Uint8Array<ArrayBuffer> and cast
      zipSync output (it allocates a fresh buffer, so the cast is safe).
    tags: [typescript, fflate, blob]
    date: 2026-08-06
  - type: constraint_found
    summary: "Repo has no typecheck script; a pre-existing tsc error hides in stop-questions.tsx"
    context: >
      npx tsc --noEmit fails on components/wizard/stop-questions.tsx(154)
      (LocationFields vs LocationFormValue address2 optionality) before any
      SPEC-018 change. Lint and vitest both pass, so CI-less type errors can
      lurk; consider adding a typecheck script in a future spec.
    tags: [typescript, tooling, tech-debt]
    date: 2026-08-06
