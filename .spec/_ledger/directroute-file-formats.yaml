entries:
  - type: assumption_invalidated
    summary: "EDate/LDate in .TRUCK files are dispatch-day offsets, not text dates"
    context: >
      The DirectRoute truck-file field reference (Notion: "DirectRoute: the
      Truck File") documents EDate/LDate as day offsets where 1 = dispatch
      date. SPEC-001's research gate had assumed VBA DateSerial text
      representations would need replicating; the field reference overruled
      that — backend/generators/truck.py emits plain integers (EDate = LDate
      = dispatch-day index). When porting macro fields, check the DirectRoute
      field reference before assuming Excel-side representations carry over.
    tags: [directroute, truck-file, file-format, edate-ldate]
    date: 2026-07-30
    source_spec: SPEC-001

  - type: decision_made
    summary: "Dynamic volume capacity columns append after the 76 base .TRUCK columns"
    context: >
      User-named volume columns (e.g. Cube, Weight) append after the macro's
      final base column (Dash Repeater), preserving exact 76-column macro
      parity for volume-less requests. Volumes are optional in the API schema
      even though the wizard UI requires at least one. The ordered
      column-definition table in backend/generators/truck.py makes column
      extensions a data change, not an emitter fork — follow that pattern for
      any future .TRUCK column additions.
    tags: [directroute, truck-file, file-format, volumes]
    date: 2026-07-30
    source_spec: SPEC-001

  - type: constraint_found
    summary: "location_db.xlsx stores whitespace-padded fixed-width text; normalize on load before matching"
    context: >
      The static candidate database (backend/data/location_db.xlsx) is a legacy
      fixed-width export whose cells are whitespace-padded (e.g. 'VA    ',
      'CHESAPEAKE                '). Depot-coordinate resolution and state
      filtering in backend/services/spatial.py compared these padded values
      against normal trimmed user input, so realistic depot address/city/state/zip
      and state filters matched nothing and stop generation failed for every
      normal input. SPEC-002's unit tests missed it because their sample fixture
      DB was clean. Fix: strip string columns in load_location_db (emitted stop
      rows are already stripped by generators.stop._clean, so output is
      unchanged). When matching against this DB — or any legacy Excel export —
      normalize whitespace on load and always test against the real data file.
    tags: [directroute, location-db, data-hygiene, stop-file]
    date: 2026-08-04
    source_spec: SPEC-003

    # Corroborated by SPEC-005: the coordinate carry-through fix's real-DB
    # assertion found no divergence from the fixture, but keep testing both —
    # the fixture wouldn't have caught a real-DB-only quirk if one existed.

  - type: pattern_discovered
    summary: "Row-assembly passthrough gaps: a column reserved in the header but silently blank means the source-to-row mapping was never wired for it"
    context: >
      backend/generators/stop.py's COLUMN_ORDER reserved Longitude/Latitude
      slots since SPEC-002, and the candidate DataFrame carried real values
      through the entire filter/thin pipeline (backend/services/spatial.py),
      but SelectedStop, selected_stops_from_candidates(), and the row_by_col
      dict in build_rows() never read or set them — so every output row
      rendered blank cells with no error. The fix is always the same three
      edits: add the field to the row dataclass, read it off the candidate
      row, add the key to row_by_col using the exact COLUMN_ORDER name.
      backend/generators/truck.py (SPEC-001) has the identical unfixed gap
      for its own Longitude/Latitude columns — apply the same three-edit
      pattern there if that generator is ever extended to carry coordinates.
      Regression-proof this class of bug with a direct source-to-output
      equality assertion per field, not just a non-blank check — "column
      present in the header" and "value actually populated" are different
      claims.
    tags: [directroute, stop-file, truck-file, row-assembly, passthrough-bug]
    date: 2026-08-04
    source_spec: SPEC-005

  - type: pattern_discovered
    summary: "Stop-file column headers are aliasable independent of row assembly; check ALIAS_FIELD_MAP/build_header before adding new alias mechanics"
    context: >
      backend/schemas/stop_config.py's ALIAS_FIELD_MAP is the single source
      of truth for which stop-file columns accept a user-supplied display
      alias (currently Name, Contact, Phone, ID1, ID2, ID3, Address_2).
      backend/generators/stop.py's build_header() applies aliases via
      _alias(aliases, key, default) (falls back to the technical name when
      blank/None); build_rows() always keys row cells by the canonical
      column name (e.g. "ID2"), never by the aliased header text, so
      aliasing a header is guaranteed display-only. The golden template
      already ships one non-technical default header ("Store #" for the
      ID1 slot), establishing that aliased headers are safe for DirectRoute
      import, not new risk surface. Before adding aliasing for a new column
      or building a parallel rename mechanism, check ALIAS_FIELD_MAP and
      build_header() first — SPEC-010 found the ID2/ID3 mechanism already
      shipped end-to-end from SPEC-002 and only needed a wizard UX/gating
      change (promoting the fields out of an advanced toggle), not new
      backend work.
    tags: [directroute, stop-file, file-format, aliasing]
    date: 2026-08-05
    source_spec: SPEC-010

  - type: assumption_confirmed
    summary: "DRProject.config is UTF-8 XML with root AppSettings; wizard-driven content lives under Configuration/Stop"
    context: >
      DirectRoute expects a file named exactly DRProject.config inside each
      user data directory (File → Preferences). The golden template at
      fixtures/drproject-config/DRProject.config confirms structure: root
      <AppSettings> with <Configuration> (stop field aliases and
      Quantities) plus a large <Preferences> tree (routing defaults,
      geocoding, map settings). Depot addresses are not in this file — it
      maps stop-file column display names, not routing geography. Substitution
      targets align with AliasConfig and VolumeSpec from stop/truck schemas.
      backend/generators/drproject_config.py loads backend/data/DRProject.config
      at runtime; tests compare against fixtures/drproject-config/.
    tags: [directroute, drproject-config, file-format]
    date: 2026-08-05
    source_spec: SPEC-012

  - type: constraint_found
    summary: "Machine-specific paths and DRTrack credentials must be cleared in generated DRProject.config output"
    context: >
      The owner template contained local filesystem paths (RecentFilesList,
      DistanceFile, MergeDirectoryAndFileSettings) and encrypted DRTrack
      credentials. These are environment-specific and must always be emitted
      empty in generated output regardless of wizard input — same data-hygiene
      principle as scrubbing proprietary paths from bundled fixtures before
      commit.
    tags: [directroute, drproject-config, data-hygiene]
    date: 2026-08-05
    source_spec: SPEC-012
