entries:
  - type: decision_made
    summary: "eslint-config-next 16 + FlatCompat crashes under ESLint 9; use a direct flat config"
    context: >
      The create-next-app-style eslint.config.mjs (FlatCompat.extends
      'next/core-web-vitals','next/typescript') throws 'Converting circular
      structure to JSON' inside @eslint/eslintrc's config validator when paired
      with eslint-config-next 16.3.0 on ESLint 9.39. The working configuration
      skips FlatCompat entirely and wires the flat config directly:
      @typescript-eslint/parser (with parserOptions.ecmaFeatures.jsx) plus
      @next/eslint-plugin-next (recommended + core-web-vitals rules) plus
      eslint-plugin-react-hooks (recommended rules). All three plugins ship as
      transitive deps of eslint-config-next, so no extra installs are needed.
      This lints clean with one informational react-hooks/incompatible-library
      warning about React Hook Form's watch() (not a defect). Reuse this pattern
      for any future Next.js 16 frontend spec in this repo.
    tags: [frontend, eslint, next, tooling]
    date: 2026-08-04
    source_spec: SPEC-003
  - type: decision_made
    summary: "Force Next.js same-origin proxy mode with an empty .env.local value; an empty env var can't be injected through the Windows process environment"
    context: >
      To make the wizard call the API same-origin (relative /api/... via a
      next.config `rewrites()`, no CORS), the client base URL must resolve to
      "". On Windows an empty env var can't be handed to the child build: both
      `$env:X=''` and [Environment]::SetEnvironmentVariable('X','','Process')
      DELETE the variable (the node child sees it absent), and a stale .env
      (e.g. NEXT_PUBLIC_API_BASE_URL=http://127.0.0.1:8080) would then be baked
      into the bundle, reintroducing CORS/tunnel-host bugs. Fix: write .env.local
      (gitignored, higher precedence than .env in Next) with
      `NEXT_PUBLIC_API_BASE_URL=`; @next/env resolves `KEY=` to a present empty
      string that overrides .env. Client resolution must use `||`/trim, not `??`
      (`??` treats "" as a set value). A fresh clone has no .env at all, so proxy
      mode is the zero-config default. Reusable for any Next.js app that chooses
      proxy-vs-direct API mode per machine.
    tags: [frontend, next, env, dotenv, proxy]
    date: 2026-08-04
    source_spec: SPEC-004
  - type: constraint_found
    summary: "TS 5.9 generic typed arrays trip both Blob construction and vitest equality around fflate"
    context: >
      Two gotchas whenever binary payloads flow through libraries whose types
      predate TypeScript's generic typed arrays (fflate 0.8.x here). (1) A
      value typed plain `Uint8Array` resolves to Uint8Array<ArrayBufferLike>,
      which `new Blob([...])` rejects (SharedArrayBuffer is not a valid
      BlobPart) — annotate decode helpers as Uint8Array<ArrayBuffer> (see
      base64ToUint8Array in lib/api.ts) and cast library returns that allocate
      fresh buffers (zipSync in lib/zip.ts). (2) vitest's toEqual on typed
      arrays is sensitive to the underlying buffer view, not just bytes:
      fflate's unzipSync returns subarray views over a shared buffer, so
      byte-identical arrays fail with "Compared values have no visual
      difference" — compare Array.from(bytes) on both sides (see
      lib/zip.test.ts).
    tags: [frontend, typescript, vitest, fflate, typed-arrays]
    date: 2026-08-06
    source_spec: SPEC-018
