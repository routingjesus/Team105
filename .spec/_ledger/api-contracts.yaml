entries:
  - type: decision_made
    summary: "Paired endpoints deliver generated files: JSON+base64 generate plus raw download"
    context: >
      A single HTTP response can't natively carry both file bytes and
      generation metadata, so SPEC-001 established the pattern:
      POST /api/trucks/generate returns routing metadata with base64-encoded
      file content; POST /api/trucks/download takes the same request body and
      returns raw bytes with a Content-Disposition attachment header.
      backend/schemas/truck_config.py is the canonical Pydantic contract that
      SPEC-002 (stop generator) and SPEC-003 (wizard UI) mirror â€” extend it
      rather than defining parallel models.
    tags: [api-contract, fastapi, file-delivery]
    date: 2026-07-30
    source_spec: SPEC-001

  - type: constraint_found
    summary: "The generation API must send CORS headers for any browser client (e.g. the wizard)"
    context: >
      The wizard UI runs on a different origin (localhost:3000) than the FastAPI
      backend (127.0.0.1:8000/8080), so the browser blocks its generate/download
      calls unless the API returns CORS headers. SPEC-001/002 shipped without
      CORS, which passed every curl and pytest TestClient check (neither is
      origin-checked) but broke the actual browser path. backend/main.py now adds
      fastapi.middleware.cors.CORSMiddleware allowing the local dev origins by
      default, overridable via a comma-separated WIZARD_ALLOWED_ORIGINS env var
      for a deployed UI. Any new browser consumer of this API must have its origin
      added; never treat a green backend suite as proof the browser flow works.
    tags: [api-contract, fastapi, cors, frontend-integration]
    date: 2026-08-04
    source_spec: SPEC-003

  - type: pattern_discovered
    summary: "Sibling download artifacts reuse StopConfig (optionally extended) and must keep that config available on the download step"
    context: >
      SPEC-012's DRProject.config generator accepts StopConfig for
      POST /api/drproject-config/{generate,download} so the wizard can call
      generateDrprojectConfig(stopConfig) with the same object passed to
      generateStops. SPEC-016 extended the pattern with StopCsvRequest
      (StopConfig + download-time branch) and sibling
      /api/stops-csv/{generate,download}. Plumb stopConfig into
      components/wizard/download.tsx; collect Branch (or similar) only on
      the download step — do not persist download-time fields in
      use-wizard-persistence or lib/build-config.ts. Prefer extending an
      existing config model over inventing a parallel Pydantic schema.
    tags: [api-contract, fastapi, file-delivery, drproject-config, wizard]
    date: 2026-08-05
    source_spec: SPEC-012
