learnings:
  - type: assumption_confirmed
    summary: >
      Hoisting Symbol/Color draws to per-stop scope (alongside eq_code /
      volume_cells) is sufficient; no identity key or schema change needed.
    context: >
      build_rows already expands consolidation lines from one SelectedStop;
      drawing once before the inner loop matches Address/FixedTime sharing
      and preserves SPEC-011 seed streams when lines_per_customer == 1.
    tags: [stop-generator, consolidation, shape, color]
    date: 2026-08-05
    source_spec: SPEC-015
  - type: pattern_discovered
    summary: >
      Consolidation visual-marker tests must assert within-stride equality
      (len({Symbol})==1), not only allowlist membership — SPEC-011 row-level
      checks would green even when line items differed.
    context: >
      tests/test_stop_generator.py::test_consolidation_shares_symbol_and_color_across_line_items
      follows the same stride grouping as coordinate/ID2 consolidation tests.
    tags: [testing, consolidation, false-green]
    date: 2026-08-05
    source_spec: SPEC-015

