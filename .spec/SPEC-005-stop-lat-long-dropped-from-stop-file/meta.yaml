learnings:
  - type: pattern_discovered
    summary: >
      Row-assembly passthrough gaps (COLUMN_ORDER reserves a slot,
      candidate DataFrame carries the value, but the dataclass/dict in
      between never reads it) are fixed identically regardless of which
      field is missing: add the field to SelectedStop, read it in
      selected_stops_from_candidates(), add the key to row_by_col in
      build_rows(). backend/generators/truck.py has the same
      Latitude/Longitude gap (SPEC-001, out of scope here) and would be
      fixed the same way if ever addressed.
    context: "backend/generators/stop.py row-assembly pipeline"
    tags: ["stop-generator", "row-assembly", "passthrough-bug"]
    date: 2026-08-04
  - type: constraint_confirmed
    summary: >
      Testing coordinate parity against both fixtures/stop/sample_location_db.xlsx
      and the real backend/data/location_db.xlsx caught no divergence here,
      but the real-DB assertion is worth keeping as a standing pattern for
      this file's tests per the SPEC-003 fixture-vs-real-DB learning — the
      lightweight fixture alone would not have caught a real-DB-specific
      formatting quirk if one existed.
    context: "tests/test_stop_generator.py::TestCoordinateCarryThrough"
    tags: ["testing", "location_db", "fixture-vs-real-db"]
    date: 2026-08-04
