learnings:
  - type: pattern_discovered
    summary: >
      A "weighted band + small-probability tail" approach (draw from a
      bounded realistic band most of the time; a low-probability branch
      draws from the remaining range) is a lightweight way to bias a
      stdlib `random.Random` draw toward a realistic distribution without
      adding a numpy/scipy dependency. Reused the existing minutes-of-day
      integer arithmetic and HHMM conversion already in
      `build_time_window()` rather than introducing new representations.
    context: "backend/generators/stop.py build_time_window() randomized branch"
    tags: ["stop-generator", "randomization", "distribution-bias"]
    date: 2026-08-05
  - type: constraint_confirmed
    summary: >
      Statistical/distributional bugs (as opposed to crashes or wrong
      values) need a large-sample test with generous thresholds (e.g.
      3000 draws, >=75%/<=20% rather than the exact ~80/90 and ~10-15
      target percentages from the problem statement) to avoid flakiness
      from a single seed's sampling noise, while still failing hard
      against the old uniform-across-the-day implementation (which
      measured ~40%/36% on the same test, well outside the new
      thresholds).
    context: "tests/test_stop_generator.py::test_randomized_mode_biases_toward_business_hours"
    tags: ["testing", "flakiness", "statistical-assertions"]
    date: 2026-08-05
