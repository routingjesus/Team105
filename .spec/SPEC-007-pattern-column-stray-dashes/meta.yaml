learnings:
  - type: gap_found
    summary: "build_pattern1's existing unit tests encoded the bug's dash-padded shape as expected output"
    context: >
      Two of the three pre-existing `build_pattern1` tests in
      tests/test_stop_generator.py asserted the old fixed-width,
      dash-padded shape (`pattern[0] == "-"`, `pattern == "-M-W-F-"`) as
      correct behavior, so the test suite passing was not evidence the
      Pattern1 format was right. Fixed by updating those tests to the
      dash-free expected values and adding a dedicated regex regression
      test (`^[SMTWRFA]*$`) at both the unit (`build_pattern1`) and
      integration (`build_rows` output) level so a future regression to
      dash-padding would be caught even if someone only skims the
      pre-existing assertions.
    tags: [self-review, testing, bug-fix]
    date: 2026-08-05

