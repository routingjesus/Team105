      labels (optional)" fieldset for ID2/ID3, always visible; the other
      five alias fields (name, contact, phone, id1, address_2) keep the
      existing aliasesEnabled-gated block untouched.
    tags: ["frontend", "ux", "scope-decision"]
    date: 2026-08-05
