      tests/test_stop_generator.py::TestBuildHeader only asserts
      name/id1 aliases; lib/build-config.test.ts only asserts the
      all-blank-aliases case (line 78); lib/wizard-schema.test.ts has
      no alias-field cases.
    tags: ["test-coverage", "stop-generator"]
    date: 2026-08-05
